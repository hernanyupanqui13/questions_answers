# Render deployment configuration
# https://render.com/docs/yaml-spec

services:
  - type: web
    name: qa-rooms
    runtime: node
    region: oregon
    plan: free  # change to "starter" for production

    buildCommand: |
      npm ci
      npx prisma generate
      npx prisma migrate deploy
      npm run build

    startCommand: node dist/server.js

    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: qa-rooms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000  # Render assigns this port

    healthCheckPath: /api/rooms

databases:
  - name: qa-rooms-db
    databaseName: qa_rooms
    user: qa_rooms_user
    region: oregon
    plan: free
